name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      # --no-sources ignores the [tool.uv.sources] cu128 index (CI is CPU-only); --locked uses the
      # committed uv.lock (generated with --no-sources) so CI is reproducible. `-m "not slow"` keeps
      # the `integration` manifest-loading smoke test on (the skill's required verification step).
      # Replace `cuvis_ai_efficientad` below with your real import package name (leave `tests` literal).
      - name: Run tests
        run: |
          uv run --no-sources --locked --extra dev pytest tests/ -m "not slow" -v --tb=long -ra \
            --cov=cuvis_ai_efficientad \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      # Replace `cuvis_ai_efficientad` with your real import package name; keep `tests` literal. The greenfield
      # skeleton ships no examples/ dir and ruff errors on a missing path, so `examples` is not listed
      # here; append it once you ship an examples/ dir (forked/mature plugins do).
      - name: Check formatting
        run: uv run --no-sources --locked --extra dev ruff format --check cuvis_ai_efficientad tests
      - name: Run ruff
        run: uv run --no-sources --locked --extra dev ruff check cuvis_ai_efficientad tests

  typecheck:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      # Non-blocking: torch stubs are incomplete; surface issues without gating CI.
      - name: Run mypy
        run: uv run --no-sources --locked --extra dev mypy cuvis_ai_efficientad/ --config-file pyproject.toml || true

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      # Non-blocking: a transitive CVE we cannot patch without breaking compatibility must not
      # block a plugin PR — surface it, don't gate.
      - name: Run pip-audit
        run: uv run --no-sources --locked --extra dev pip-audit --strict --desc on || true
      # Non-blocking (skill default): a Windows-authored baseline uses backslash paths that a Linux
      # runner's scan won't match, so gating here is fragile; surface findings without blocking.
      - name: Run detect-secrets
        run: uv run --no-sources --locked --extra dev detect-secrets scan --baseline .secrets.baseline || true
      - name: Run bandit
        run: uv run --no-sources --locked --extra dev bandit -r cuvis_ai_efficientad/ -c pyproject.toml || true

  build:
    name: Build and validate
    needs: [test, lint, typecheck, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate distributions
        run: uv run --no-sources --with twine twine check dist/*
